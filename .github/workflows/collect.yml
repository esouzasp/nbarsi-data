name: coleta-diaria

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 18:30 em Brasília, após o fechamento da B3
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["collect.py", "news.py", "timeline.json", "universe.json", "requirements.txt", ".github/workflows/collect.yml"]

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python collect.py
      - name: Central de notícias
        run: python news.py
        continue-on-error: true
      - name: Salvar dados
        run: |
          git config user.name "nbarsi-bot"
          git config user.email "nbarsi-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "dados $(date -u +%Y-%m-%d)"
          git push
