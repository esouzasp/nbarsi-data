<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nBarsi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Mesa de análise: papel frio, tinta azul-petróleo, verde de caixa como acento, ouro só para proventos.
     Layout: barra de abas; cada aba começa pelo resumo e desce para o detalhe. */
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#15212A; --muted:#5D6A6F; --line:#DAE0DA; --soft:#E9EEEA;
  --accent:#0E6B5A; --accent-ink:#FFFFFF; --gold:#9C7A1F;
  --good:#1E7A4C; --bad:#B23838; --warn:#A86F12;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#d55181;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1316; --surface:#141C20; --ink:#E3E9E6; --muted:#92A09E; --line:#26323A; --soft:#1A252A;
    --accent:#3DB394; --accent-ink:#04110D; --gold:#D4B05A; --good:#4CC38A; --bad:#EF7C7C; --warn:#E4B454;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#e0709a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1316; --surface:#141C20; --ink:#E3E9E6; --muted:#92A09E; --line:#26323A; --soft:#1A252A;
  --accent:#3DB394; --accent-ink:#04110D; --gold:#D4B05A; --good:#4CC38A; --bad:#EF7C7C; --warn:#E4B454;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#e0709a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.42}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:.84rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
h3{font-size:1.02rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .gold{color:var(--gold)}

header.top{position:sticky;top:0;z-index:5;background:#0A0E10;border-bottom:3px solid #F2B01E;color:#E8ECEA;color-scheme:dark}
.top-inner{max-width:1360px;margin:0 auto;padding:5px 16px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand h1{margin:0;line-height:0}
.brand img{height:40px;width:auto;display:block}
.brand .tag{font-size:.8rem;color:#9AA7A5;max-width:22ch;line-height:1.3}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
.chat .msgs{display:grid;gap:12px;max-height:62vh;overflow-y:auto;padding:4px 2px}
.msg{max-width:85%;padding:7px 11px;border-radius:10px;font-size:.86rem;line-height:1.45}
.msg p{margin:0 0 6px} .msg p:last-child{margin-bottom:0} .msg ul{margin:4px 0 6px;padding-left:18px}
.msg.user{justify-self:end;background:var(--ink);color:var(--surface)}
.msg.assistant{justify-self:start;background:var(--bg);border:1px solid var(--line)}
.chatcard{max-width:100%}
.chatform{display:flex;gap:10px;align-items:end}
.sug{gap:6px}
.btn.chipbtn{padding:4px 10px;font-size:.8rem;border-radius:999px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
table.audit td.pillar{font-weight:600;vertical-align:top;border-right:1px solid var(--line)}
table.audit tr.sub td{background:var(--bg);font-size:.82rem;color:var(--muted)}
.formula{white-space:normal;min-width:260px;font-family:var(--mono);font-size:.76rem}
.formula-box{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px;display:grid;gap:4px;background:var(--bg)}
.formula-box .num{font-size:1.02rem}
ol.steps{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.8rem;max-width:120ch}
code{font-family:var(--mono);font-size:.78rem}
.stages{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.stage{font-size:.72rem;padding:0 6px;border-radius:4px;background:var(--soft);color:var(--muted);white-space:nowrap}
.stage.ok{color:var(--good)} .stage.no{color:var(--bad)}
.pill.small{font-size:.68rem;padding:0 6px;margin-top:2px}
.nm{color:var(--muted);font-size:.74rem;margin-left:6px}
.swatch{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
th.grp{text-align:center;border-bottom:3px solid;color:var(--ink)}
.bar-track.thin{height:6px}
.portgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;align-items:start}
.bars.sectors{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));column-gap:28px}
.chip.port{background:transparent;border:1.5px solid;color:var(--ink);margin-left:3px;font-weight:600}
.portpick{display:flex;align-items:center;gap:8px;font-size:.8rem;color:#9AA7A5}
.portpick select{width:auto;font-weight:600;color:#FFFFFF;background:#1A2226;border-color:#33403F}
nav.tabs a{padding:5px 9px;border-radius:5px;text-decoration:none;color:#B4C0BE;font-weight:500;font-size:.84rem}
nav.tabs a:hover{background:rgba(255,255,255,.08);color:#FFFFFF}
nav.tabs a[aria-current="page"]{background:#F2B01E;color:#0A0E10}

main{max-width:1360px;margin:0 auto;padding:12px 16px;display:grid;gap:12px}
.banner{padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--soft);font-size:.9rem}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.freshness{display:flex;gap:12px;flex-wrap:wrap;font-size:.72rem;color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;display:grid;gap:0}
.kpi .label{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .value{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.08rem;font-weight:500}
.kpi .sub{font-size:.72rem;color:var(--muted)}

.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;align-items:start}
.grid2.even{grid-template-columns:1fr 1fr}
@media (max-width:960px){.grid2,.grid2.even{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stack{display:grid;gap:12px;align-content:start;min-width:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.8rem}
th{font-weight:500;color:var(--muted);text-align:left;font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;padding:3px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
td{padding:3px 6px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.tick{font-family:var(--mono);font-weight:500}
.tfoot td{font-weight:600;border-top:1px solid var(--ink)}

.pill{display:inline-block;padding:0 6px;border-radius:999px;font-size:.68rem;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.pill.comprar,.pill.elegivel,.pill.atrativo{color:var(--good)} .pill.analisar{color:var(--warn);border-style:dashed} .pill.dados{color:var(--muted);border-style:dashed} .pill.manter{color:var(--accent)} .pill.aguardar,.pill.incompleto{color:var(--warn)} .pill.revisar,.pill.vender,.pill.fora{color:var(--bad)} .pill.semdados{color:var(--muted)}
.chip{display:inline-block;padding:0 5px;border-radius:4px;font-size:.67rem;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.held{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-weight:600}

.score{display:inline-grid;grid-template-columns:26px 48px;gap:5px;align-items:center}
.score .val{font-family:var(--mono);font-weight:500;text-align:right}
.score .track{height:6px;border-radius:3px;background:var(--soft);position:relative;overflow:hidden}
.score .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}

.btn{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:.8rem}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:2px 6px}
.btn.ghost:hover{color:var(--bad)}
.btn.link{border:none;background:none;color:var(--accent);padding:0;font-weight:500}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:3px 9px;cursor:pointer;font-size:.76rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
label.f{display:grid;gap:2px;font-size:.7rem;color:var(--muted)}
input[type=text],input[type=date],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:3px 6px;width:100%;min-width:0;font-size:.82rem}
textarea{font-family:var(--mono);font-size:.82rem;line-height:1.45;resize:vertical}
input.cell{width:76px;text-align:right;font-family:var(--mono);padding:2px 5px}

.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart .axis{fill:var(--muted);font-size:11px;font-family:var(--mono)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .endlabel{fill:var(--ink);font-size:11.5px;font-family:var(--body)}
.chart .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.8rem;box-shadow:0 4px 14px rgba(0,0,0,.12);min-width:170px;z-index:3}
.chart .tip .d{color:var(--muted);margin-bottom:4px}
.chart .tip .l{display:flex;justify-content:space-between;gap:14px}
.chart .tip i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.74rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

.bars{display:grid;gap:6px}
.bar-row{display:grid;gap:4px}
.bar-label{display:flex;justify-content:space-between;font-size:.78rem;gap:8px}
.bar-track{position:relative;height:9px;border-radius:5px;background:var(--soft)}
.bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}
.bar-fill.over{background:var(--warn)}
.bar-mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}

.checks{display:grid;gap:2px;margin:0;padding:0;list-style:none;font-size:.78rem}
.checks li{display:grid;grid-template-columns:16px 1fr auto;gap:6px;align-items:baseline;padding:2px 0;border-bottom:1px solid var(--line)}
.checks li:last-child{border-bottom:none}
.checks .mk{font-weight:700;text-align:center}
.alerts{display:grid;gap:5px;margin:0;padding:0;list-style:none}
.alerts li{display:grid;grid-template-columns:3px 1fr;gap:8px;font-size:.78rem}
.alerts li::before{content:"";border-radius:2px;background:var(--warn)}
.alerts li.bad::before{background:var(--bad)} .alerts li.ok::before{background:var(--good)}

.verdict{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px;background:var(--bg);min-width:0}
.verdict ul{margin:0;padding-left:18px} .verdict li{margin:2px 0}
.note{font-size:.74rem;color:var(--muted);max-width:110ch;margin:0;line-height:1.4}
details summary{cursor:pointer;color:var(--accent);font-size:.85rem}
.empty{padding:12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:8px;font-size:.88rem;z-index:20}
.tip .ev{max-width:260px;white-space:normal;font-size:.72rem;border-top:1px solid var(--line);margin-top:3px;padding-top:3px;color:var(--ink)}
.chip.good{color:var(--good)} .chip.bad{color:var(--bad)}
.legend i.mk{width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--good)} .legend i.mk.top{border-color:var(--bad)} .legend i.mk.ev{border-radius:0;border:none;border-left:2px dashed var(--muted);width:2px}
table.news td{vertical-align:top}
.facts{padding:6px 2px;white-space:normal}
.facts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:6px;font-size:.8rem}
.facts h4{margin:6px 0 3px;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.facts ul{margin:0;padding-left:16px}
.facts li{margin:2px 0}
table.mini{font-size:.76rem}
table.mini td,table.mini th{padding:2px 6px}
tr.facts-row>td{background:var(--soft)}
.caret{color:var(--muted);font-size:.7rem}
.asset-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.asset-head .big{font-family:var(--mono);font-size:1.3rem}
</style>
</head>
<body>
<div id="root"><main><div class="banner">Carregando nBarsi…</div></main></div>

<script src="market.js" onerror="window.NBARSI_MARKET_MISSING=true"></script>
<script src="news.js" onerror="window.NBARSI_NEWS_MISSING=true"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const { useState, useEffect, useMemo, useRef, useLayoutEffect } = React;
const html = htm.bind(React.createElement);
const MARKET = window.NBARSI_MARKET || null;
const NEWS = window.NBARSI_NEWS || null;

/* ================= utilidades ================= */
const brl = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
const n2 = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const n1 = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const n0 = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 0 });
const ok = v => v != null && isFinite(v);
const fBRL = v => ok(v) ? brl.format(v) : "—";
const fBRLc = v => !ok(v) ? "—" : Math.abs(v) >= 1e9 ? "R$ " + n1.format(v / 1e9) + " bi" : Math.abs(v) >= 1e6 ? "R$ " + n1.format(v / 1e6) + " mi" : brl.format(v);
const fPct = (v, d = 1) => ok(v) ? (v * 100).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }) + "%" : "—";
const fSignPct = (v, d = 1) => ok(v) ? (v >= 0 ? "+" : "") + fPct(v, d) : "—";
const fNum = v => ok(v) ? n2.format(v) : "—";
const fX = v => ok(v) ? n1.format(v) + "x" : "—";
const cls = v => !ok(v) || Math.abs(v) < 1e-9 ? "" : v > 0 ? "good" : "bad";
const clamp01 = x => Math.max(0, Math.min(1, x));
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fDate = iso => iso ? iso.split("-").reverse().join("/") : "—";
const fMonth = iso => { const [y, m] = iso.split("-"); return ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"][+m - 1] + "/" + y.slice(2); };
const parseNum = s => { if (typeof s === "number") return s; if (s == null) return NaN; let t = String(s).trim().replace(/\s|R\$/g, ""); if (t.includes(",")) t = t.replace(/\./g, "").replace(",", "."); return parseFloat(t); };
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000);

/* ================= metodologia (regras executáveis) ================= */
const DEFAULT_RULES = {
  versao: 2,
  objetivo: "Retorno total (dividendos + valorização) acima do CDI e do IDIV, com preservação de capital",
  limites: { max_peso_ativo: 0.15, max_peso_setor: 0.40 },
  preco_teto: { dy_alvo: 0.06, base: "média de proventos por ação dos últimos 5 anos" },
  elegibilidade: { liquidez_min: 5000000, anos_com_dividendos_min: 4, lucro_anos_positivos_min: 3 },
  pesos_score: { dividendos: 0.35, qualidade: 0.30, valuation: 0.35 },
  recomendacao: { score_compra: 65, score_revisar: 40, margem_aguardar: -0.25 },
  projecao: { inflacao: 0.04, cdi_longo_prazo: 0.10, anos_convergencia_cdi: 3, crescimento_min: -0.03, crescimento_max: 0.08, peso_historico: 0.5, dy_max: 0.12, spread_pessimista: 0.03, spread_otimista: 0.02 },
  perfis: {
    banco: { roe_min: 0.15, pvp_max: 2.0, payout_min: 0.40, dy_min: 0.05 },
    seguradora: { roe_min: 0.18, payout_min: 0.60, dy_min: 0.06, pl_max: 12 },
    holding: { dy_min: 0.06, pvp_max: 1.5 },
    utility: { dy_min: 0.06, div_liq_ebitda_max: 3.5, pl_max: 15 },
    saneamento: { dy_min: 0.03, div_liq_ebitda_max: 3.0, pl_max: 15 },
    telecom: { dy_min: 0.05, div_liq_ebitda_max: 2.5, pl_max: 18 },
    industria: { roe_min: 0.18, div_liq_ebitda_max: 1.5, pl_max: 30, usar_preco_teto: false },
    commodity: { dy_min: 0.06, div_liq_ebitda_max: 2.0, pl_max: 10, penalidade_ciclica: 15 },
    construcao: { roe_min: 0.15, dy_min: 0.05, pl_max: 10, penalidade_ciclica: 10 },
    consumo: { roe_min: 0.15, dy_min: 0.04, pl_max: 20 },
    outro: { dy_min: 0.05, pl_max: 15 }
  }
};
function rulesFrom(version) {
  const r = version?.rules;
  if (!r || typeof r !== "object" || !r.perfis) return { rules: DEFAULT_RULES, fallback: true };
  return { rules: { ...DEFAULT_RULES, ...r, perfis: { ...DEFAULT_RULES.perfis, ...r.perfis }, projecao: { ...DEFAULT_RULES.projecao, ...(r.projecao || {}) } }, fallback: false };
}

/* ================= motor de pontuação (determinístico) ================= */
const FORMULAS = {
  dy: "mín(1; DY 12m ÷ (1,5 × DY mínimo do perfil))",
  anos: "anos com proventos nos últimos 5 ÷ 5",
  cortes: "1 − 0,34 × nº de anos com queda > 20% nos proventos",
  cresc: "0,5 + 5 × crescimento anual composto dos proventos (5 anos), limitado a 0–1",
  roe: "mín(1; ROE ÷ (1,33 × ROE mínimo do perfil))",
  lucro: "anos com lucro líquido positivo ÷ anos disponíveis (até 4)",
  dl: "x ≤ 0 → 1; x ≤ máx → 1 − 0,4·x/máx; x > máx → máx(0; 0,6 − (x − máx)/máx)",
  payout: "payout < mín → payout/mín; entre mín e 110% → 1; > 110% → 0,4",
  margem: "0,5 + 1,5 × (preço-teto ÷ cotação − 1), limitado a 0–1; preço-teto = média de proventos por ação em 5 anos ÷ DY-alvo",

/* Midway 103% do CDI: bruto e líquido de IR (tabela regressiva sobre o ganho) */
const MIDWAY = { mult: 1.03, label: "Midway 103% CDI" };
const irRate = days => days <= 180 ? 0.225 : days <= 360 ? 0.20 : days <= 720 ? 0.175 : 0.15;
function midwaySeries(cdiBase, dates) {
  if (!cdiBase) return null; const gross = [], net = []; let g = null, start = null;
  cdiBase.forEach((v, k) => {

    gross.push(g); net.push(g - (g - cdiBase[start]) * irRate(daysBetween(dates[start], dates[k])));

function portStats(p, M, scored, pf) {
  const tg = p.targets; const tsum = tg.reduce((s, x) => s + x.target, 0) || 1;
  const w = t => t.target / tsum;
  const qty = {}; p.txs.forEach(t => { qty[t.ticker] = (qty[t.ticker] || 0) + (t.type === "venda" ? -t.qty : t.qty); });
  const val = t => (qty[t] || 0) * (M.assets[t]?.price || 0);
  const mv = Object.keys(qty).reduce((s, t) => s + val(t), 0);
  const weightOf = t => mv ? val(t) / mv : w(tg.find(x => x.ticker === t) || { target: 0 });
  const dyTarget = tg.reduce((s, x) => s + w(x) * (M.assets[x.ticker]?.dy_12m || 0), 0);
  const projDivs = Object.keys(qty).reduce((s, t) => s + (qty[t] || 0) * (M.assets[t]?.dps_12m || 0), 0);
  const score = tg.reduce((s, x) => s + w(x) * (scored[x.ticker]?.score || 0), 0);
  const sec = {}; (mv ? Object.keys(qty) : tg.map(x => x.ticker)).forEach(t => { const m = macro(M.assets[t]?.sector); sec[m] = (sec[m] || 0) + weightOf(t); });
  const top = Object.entries(sec).sort((a, b) => b[1] - a[1])[0] || ["—", 0];
  return { qty, mv, weightOf, dyTarget, projDivs, score, sec, top, tsum, cost: p.txs.reduce((s, t) => s + (t.type === "compra" ? 1 : -1) * (t.qty * t.price + (t.type === "compra" ? 1 : -1) * (t.fees || 0)), 0) };
}

/* ================= projeção (determinística) ================= */
const clampR = (x, a, b) => Math.max(a, Math.min(b, x));
function assetExpectation(a0, rules) {
  const P = rules.projecao || DEFAULT_RULES.projecao;
  if (!a0 || !ok(a0.price)) return null;
  const a = effAsset(a0, rules).a;
  const dy5 = a.dps_avg_5y && a.price ? a.dps_avg_5y / a.price : null;
  let dy = ok(a.dy_12m) && ok(dy5) ? (a.dy_12m + dy5) / 2 : (ok(a.dy_12m) ? a.dy_12m : ok(dy5) ? dy5 : 0);
  dy = Math.min(dy, P.dy_max);
  let gh = ok(a.dps_cagr) ? a.dps_cagr : null;
  if (ok(a.lucro_cagr)) gh = gh == null ? a.lucro_cagr : (gh + a.lucro_cagr) / 2;
  const g = P.peso_historico * clampR(gh ?? P.inflacao, P.crescimento_min, P.crescimento_max) + (1 - P.peso_historico) * P.inflacao;
  return { dy, g, r: dy + g };
}
function portfolioExpectation(targets, M, rules) {
  const tsum = targets.reduce((s, t) => s + t.target, 0) || 1; let dy = 0, g = 0, w = 0;
  for (const t of targets) { const e = assetExpectation(M.assets[t.ticker], rules); if (!e) continue; const wt = t.target / tsum; dy += wt * e.dy; g += wt * e.g; w += wt; }
  if (!w) return null; dy /= w; g /= w; return { dy, g, r: dy + g };
}
function cdiPath(M, rules, years) {
  const P = rules.projecao; const now = (M.cdi?.annual_now || 13) / 100; const n = Math.max(1, P.anos_convergencia_cdi);
  return Array.from({ length: years }, (_, k) => k < n ? now + (P.cdi_longo_prazo - now) * (k + 1) / n : P.cdi_longo_prazo);
}
function project(exp, years, rules, start = 100000) {
  const P = rules.projecao; const mk = r => { const v = [start]; for (let k = 0; k < years; k++) v.push(v[k] * (1 + r)); return v; };
  return { base: mk(exp.r), pess: mk(exp.r - P.spread_pessimista), otim: mk(exp.r + P.spread_otimista), dy: exp.dy, r: exp.r, g: exp.g };
}
function projectCdi(M, rules, years, start = 100000) { const path = cdiPath(M, rules, years); const v = [start]; path.forEach((r, k) => v.push(v[k] * (1 + r))); return { values: v, avg: Math.pow(v[years] / start, 1 / years) - 1 }; }
const yearDates = years => { const d = new Date(); return Array.from({ length: years + 1 }, (_, k) => new Date(d.getFullYear() + k, d.getMonth(), 15).toISOString().slice(0, 10)); };
function withAsset(targets, ticker, weight) {
  const others = targets.filter(t => t.ticker !== ticker); const osum = others.reduce((s, t) => s + t.target, 0) || 1;
  return others.map(t => ({ ticker: t.ticker, target: t.target / osum * (100 - weight * 100) })).concat([{ ticker, target: weight * 100 }]);
}

function Projecao({ ctx }) {
  const { M, ports, rules } = ctx;
  const [H, setH] = useState(10);
  const rows = ports.map(p => { const e = portfolioExpectation(p.targets, M, rules); return e && { p, e, pr: project(e, H, rules) }; }).filter(Boolean);
  const cdi = projectCdi(M, rules, H);
  const midG = (() => { const v = [100000]; cdiPath(M, rules, H).forEach((r, k) => v.push(v[k] * (1 + r * MIDWAY.mult))); return v; })();
  const midN = midG.map((v, k) => v - (v - 100000) * irRate(k * 365));
  if (!rows.length) return null;
  const dates = yearDates(H);
  const series = rows.map(x => ({ name: x.p.name, short: shortName(x.p.name), color: x.p.color, values: x.pr.base, width: 2.5 }))
    .concat(rows.map(x => ({ name: x.p.name + " pessimista", short: "", color: x.p.color, values: x.pr.pess, width: 1, dash: "2 3", nolabel: true })))
    .concat([{ name: "CDI projetado", short: "CDI", color: "var(--muted)", values: cdi.values, dash: "6 4", width: 1.5 }, { name: "Midway 103% CDI líquido", short: "Midway líq.", color: "var(--ink)", values: midN, dash: "2 3", width: 1.5 }]);
  const legend = rows.map(x => ({ name: x.p.name, color: x.p.color })).concat([{ name: "CDI projetado", color: "var(--muted)", dash: true }, { name: "Midway 103% CDI líquido de IR", color: "var(--ink)", dash: true }, { name: "cenário pessimista (pontilhado)", color: "var(--muted)", dash: true }]);
  const P = rules.projecao;
  return html`<section class="panel">
    <div class="panel-head"><h2>Projeção de R$ 100 mil</h2>
      <div class="seg" role="group" aria-label="Horizonte">${[7, 10, 15].map(y => html`<button key=${y} aria-pressed=${H === y} onClick=${() => setH(y)}>${y} anos</button>`)}</div></div>
    <${Legend} series=${legend} />
    <${LineChart} dates=${dates} series=${series} height=${300} yFmt=${v => v >= 1e6 ? n1.format(v / 1e6) + " mi" : n0.format(v / 1e3) + " mil"} />
    <div class="tablewrap"><table>
      <thead><tr><th>Carteira</th><th class="r">Retorno esperado a.a.</th><th class="r">DY normalizado</th><th class="r">Crescimento dos proventos</th><th class="r">Valor em ${H} anos (pess. · base · otim.)</th><th class="r">Proventos no ano ${H}</th><th class="r">Contra o CDI no fim</th><th class="r">Contra Midway líq.</th></tr></thead>
      <tbody>${rows.map(x => html`<tr key=${x.p.id}><td><span class="swatch" style=${{ background: x.p.color }}></span><strong>${x.p.name}</strong></td>
        <td class="r num">${fPct(x.e.r)}</td><td class="r num gold">${fPct(x.e.dy)}</td><td class="r num">${fSignPct(x.e.g)}</td>
        <td class="r num"><span class="muted">${fBRLc(x.pr.pess[H])} · </span>${fBRLc(x.pr.base[H])}<span class="muted"> · ${fBRLc(x.pr.otim[H])}</span></td>
        <td class="r num gold">${fBRLc(x.pr.base[H - 1] * x.e.dy)}</td>
        <td class=${"r num " + cls(x.pr.base[H] - cdi.values[H])}>${fSignPct(x.pr.base[H] / cdi.values[H] - 1, 0)}</td><td class=${"r num " + cls(x.pr.base[H] - midN[H])}>${fSignPct(x.pr.base[H] / midN[H] - 1, 0)}</td></tr>`)}
        <tr><td><span class="swatch" style=${{ background: "var(--muted)" }}></span>CDI</td><td class="r num">${fPct(cdi.avg)}</td><td></td><td></td><td class="r num">${fBRLc(cdi.values[H])}</td><td></td><td></td><td></td></tr>
        <tr><td><span class="swatch" style=${{ background: "var(--ink)" }}></span>Midway 103% CDI (bruto · líquido de IR)</td><td class="r num">${fPct(Math.pow(midG[H] / 100000, 1 / H) - 1)} · ${fPct(Math.pow(midN[H] / 100000, 1 / H) - 1)}</td><td></td><td></td><td class="r num">${fBRLc(midG[H])} · ${fBRLc(midN[H])}</td><td></td><td></td><td></td></tr></tbody>
    </table></div>
    <p class="note">Modelo simples de renda: retorno esperado = dividend yield normalizado (média entre o DY de 12 meses e o DY da média de 5 anos, limitado a ${fPct(P.dy_max, 0)}) + crescimento dos proventos (${fPct(P.peso_historico, 0)} do histórico, limitado entre ${fPct(P.crescimento_min, 0)} e ${fPct(P.crescimento_max, 0)}, e o restante pela inflação de ${fPct(P.inflacao, 0)}). Proventos reinvestidos, sem impostos nem rebalanceamento. Pessimista −${fPct(P.spread_pessimista, 0)} e otimista +${fPct(P.spread_otimista, 0)} ao ano. CDI parte de ${fNum(M.cdi?.annual_now)}% e converge para ${fPct(P.cdi_longo_prazo, 0)} em ${P.anos_convergencia_cdi} anos. Ajuste os parâmetros em Metodologia → "projecao". É uma régua para comparar carteiras, não uma previsão.</p>
  </section>`;
}

function Recomendacoes({ ctx }) {
  const { M, scored, rules, ports, db, toast, sample, decisions, methodology } = ctx;
  const [amount, setAmount] = useState("5000");
  const [phase, setPhase] = useState("idle"); const [rep, setRep] = useState(null); const [err, setErr] = useState("");
  const [openT, setOpenT] = useState(null);
  if (!M) return html`<${NoMarket} />`;
  const A = parseNum(amount) || 0;
  const lim = rules.limites;
  const per = ports.map(p => {
    const st = portStats(p, M, scored);
    const hold = p.targets.map(t => { const a = M.assets[t.ticker] || {}; const sc = scored[t.ticker] || scoreAsset(null, rules); const value = (st.qty[t.ticker] || 0) * (a.price || 0); const weight = st.mv ? value / st.mv : 0; const target = t.target / st.tsum; return { t: t.ticker, a, sc, value, weight, target, rec: recommend(sc, { weight, target, asset: a, groupWeight: st.mv ? st.sec[macro(a.sector)] : null }, rules) }; });
    const total = st.mv + A;
    const cand = hold.filter(h => (h.rec.action === "comprar" || (!rules.recomendacao?.tres_estagios && h.rec.action === "manter")) && ok(h.a.price));
    const gaps = cand.map(h => ({ h, g: Math.max(0, h.target * total - h.value) * (0.5 + (h.sc.score || 0) / 200) }));
    const gs = gaps.reduce((s, x) => s + x.g, 0);
    const plan = gaps.map(({ h, g }) => { const alloc = gs ? A * g / gs : 0; const q = Math.floor(alloc / h.a.price); return { ...h, alloc, q, cost: q * h.a.price }; }).filter(x => x.alloc > 0).sort((a, b) => b.alloc - a.alloc);
    const alerts = [];
    Object.entries(st.sec).forEach(([s, w]) => { if (w > lim.max_peso_setor + 1e-9) alerts.push({ k: "warn", t: `${s} com ${fPct(w)}, acima do limite de ${fPct(lim.max_peso_setor, 0)}.` }); });
    hold.forEach(h => { if (h.weight > lim.max_peso_ativo + 1e-9) alerts.push({ k: "bad", t: `${h.t} pesa ${fPct(h.weight)}, acima do limite por ativo.` }); if (h.rec.action === "revisar") alerts.push({ k: "bad", t: `${h.t}: ${h.rec.why}` }); });
    const miss = ["Saneamento", "Telecom"].filter(s => !st.sec[s]);
    if (miss.length) alerts.push({ k: "warn", t: `Sem exposição a ${miss.join(" e ")} (letras do BEST).` });
    return { p, st, hold, plan, planCost: plan.reduce((s, x) => s + x.cost, 0), alerts };
  });
  const union = [...new Set(ports.flatMap(p => p.targets.map(t => t.ticker)))].sort((a, b) => (scored[b]?.score || 0) - (scored[a]?.score || 0));
  const heldAny = new Set(union);
  const cands = Object.entries(scored).filter(([t, s]) => !heldAny.has(t) && s.status === "elegivel" && ok(s.score)).sort((a, b) => b[1].score - a[1].score).slice(0, 8)
    .map(([t, s]) => { const a = M.assets[t]; const best = Object.entries(s.pillars).filter(([, v]) => ok(v)).sort((x, y) => y[1] - x[1])[0]; return { t, s, a, best }; });
  per.forEach(x => { x.swaps = x.hold.map(h => { const alt = cands.find(c => macro(c.a.sector) === macro(h.a.sector) && c.a.sector === h.a.sector && ok(h.sc.score) && c.s.score >= h.sc.score + 15); return alt ? { h, alt } : null; }).filter(Boolean); });

  async function register(x) {
    const now = Date.now();
    try { for (const [i, pl] of x.plan.filter(pl => pl.q > 0).entries()) await db.collection("transactions").add({ date: todayISO(), type: "compra", ticker: pl.t, qty: pl.q, price: pl.a.price, fees: 0, note: "Aporte guiado", portfolio: x.p.id, createdAt: now + i }); toast(`Compras registradas em ${x.p.name}`); }
    catch (e) { toast("Erro ao registrar"); }
  }
  async function committee() {
    if (!sample) return; setErr(""); setRep(null); setPhase("run");
    const packet = { data: todayISO(), cdi_anual: M.cdi?.annual_now, carteiras: per.map(x => ({ nome: x.p.name, descricao: x.p.description, racional: x.p.rationale, dy_carteira: x.st.dyTarget, pontuacao_media: x.st.score, grupos: x.st.sec, alertas: x.alerts.map(a => a.t), ativos: x.hold.map(h => ({ ticker: h.t, grupo: macro(h.a.sector), perfil: h.a.profile, peso_alvo: h.target, peso_atual: h.weight, pontuacao: h.sc.score, dy_12m: h.a.dy_12m, margem_preco_teto: h.sc.margin, pl: h.a.pl, roe: h.a.roe, div_liq_ebitda: h.a.div_liq_ebitda, cortes_proventos: h.a.div_cuts_20pct, sinal_motor: h.rec.action })) })), candidatos_fora: cands.map(c => ({ ticker: c.t, grupo: macro(c.a.sector), perfil: c.a.profile, pontuacao: c.s.score, dy_12m: c.a.dy_12m, margem_preco_teto: c.s.margin })) };

function Operacoes({ ctx }) {
  const { db, toast, M, ports } = ctx;
  const blank = { portfolio: ports[0]?.id || "", date: todayISO(), type: "compra", ticker: "", qty: "", price: "", fees: "" };
  const [f, setF] = useState(blank);
  const set = (k, v) => setF({ ...f, [k]: v });
  async function save(e) {
    e.preventDefault();
    const rec = { date: f.date, type: f.type, ticker: f.ticker.trim().toUpperCase(), qty: parseNum(f.qty), price: parseNum(f.price), fees: parseNum(f.fees) || 0, portfolio: f.portfolio, createdAt: Date.now() };
    if (!rec.portfolio || !rec.ticker || !(rec.qty > 0) || !(rec.price > 0)) return toast("Informe carteira, ativo, quantidade e preço.");
    try { await db.collection("transactions").add(rec); toast("Operação salva"); setF({ ...blank, portfolio: f.portfolio, date: f.date, type: f.type }); } catch (err) { toast("Não foi possível salvar"); }
  }
  const all = ports.flatMap(p => p.txs.map(t => ({ ...t, p })));
  const list = all.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt || 0) - (a.createdAt || 0));
  const tickers = M ? Object.keys(M.assets).sort() : [];
  return html`
  <section class="panel">
    <h2>Registrar operação</h2>
    <form class="form" onSubmit=${save}>
      <label class="f" for="o-p0">Carteira<select id="o-p0" value=${f.portfolio} onChange=${e => set("portfolio", e.target.value)}>${ports.map(p => html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}</select></label>
      <label class="f" for="o-d">Data<input id="o-d" type="date" value=${f.date} onInput=${e => set("date", e.target.value)} /></label>
      <label class="f" for="o-t">Tipo<select id="o-t" value=${f.type} onChange=${e => set("type", e.target.value)}><option value="compra">Compra</option><option value="venda">Venda</option></select></label>
      <label class="f" for="o-k">Ativo<input id="o-k" type="text" list="tk" value=${f.ticker} onInput=${e => set("ticker", e.target.value.toUpperCase())} /></label>
      <label class="f" for="o-q">Quantidade<input id="o-q" type="text" inputmode="numeric" value=${f.qty} onInput=${e => set("qty", e.target.value)} /></label>
      <label class="f" for="o-p">Preço (R$)<input id="o-p" type="text" inputmode="decimal" value=${f.price} onInput=${e => set("price", e.target.value)} /></label>
      <label class="f" for="o-c">Custos (R$)<input id="o-c" type="text" inputmode="decimal" value=${f.fees} onInput=${e => set("fees", e.target.value)} placeholder="0" /></label>
      <button class="btn primary" type="submit">Salvar</button>
    </form>
    <datalist id="tk">${tickers.map(t => html`<option key=${t} value=${t} />`)}</datalist>
    <p class="note">Proventos não precisam ser lançados: o nBarsi calcula pela data-com e pela quantidade em carteira.</p>
  </section>
  <section class="panel">
    <h2>Histórico (${list.length})</h2>
    ${list.length ? html`<div class="tablewrap"><table>
      <thead><tr><th>Data</th><th>Carteira</th><th>Tipo</th><th>Ativo</th><th class="r">Qtd</th><th class="r">Preço</th><th class="r">Total</th><th>Obs.</th><th></th></tr></thead>
      <tbody>${list.map(t => html`<tr key=${t.id}><td class="num">${fDate(t.date)}</td><td><span class="chip port" style=${{ borderColor: t.p.color }}>${shortName(t.p.name)}</span></td><td>${t.type}</td><td class="tick">${t.ticker}</td><td class="r num">${n0.format(t.qty)}</td><td class="r num">${fNum(t.price)}</td><td class="r num">${fBRL(t.qty * t.price + (t.type === "compra" ? 1 : -1) * (t.fees || 0))}</td><td class="small muted">${t.note || ""}</td>
        <td><button class="btn ghost" onClick=${async () => { try { await db.doc("transactions/" + t.id).delete(); toast("Excluída"); } catch (e) { toast("Erro ao excluir"); } }}>Excluir</button></td></tr>`)}</tbody></table></div>`
    : html`<div class="empty">Nenhuma operação registrada.</div>`}
  </section>`;
}

function PortfolioEditor({ p, ctx }) {
  const { M, db, toast } = ctx;
  const [rows, setRows] = useState([]);
  useEffect(() => { setRows(p.targets.map(t => ({ ticker: t.ticker, target: String(t.target).replace(".", ",") }))); }, [p.id, JSON.stringify(p.targets)]);
  const tsum = rows.reduce((s, r) => s + (parseNum(r.target) || 0), 0);
  const upd = (i, k, v) => setRows(rows.map((r, j) => j === i ? { ...r, [k]: v } : r));
  const liveVio = targetViolations(rows.map(r => ({ ticker: r.ticker.trim().toUpperCase(), target: parseNum(r.target) || 0 })).filter(r => r.ticker), M, ctx.rules);
  const list = () => rows.map(r => ({ ticker: r.ticker.trim().toUpperCase(), target: parseNum(r.target) || 0 })).filter(r => r.ticker);
  async function save() { try { await ctx.saveTargets(p, list()); toast(liveVio.length ? `${p.name} salva com ${liveVio.length} violação(ões) sinalizada(s)` : `${p.name} salva`); } catch (e) { toast("Erro ao salvar"); } }
  async function duplicate() {
    const base = (p.name + "-copia").toLowerCase().replace(/[^a-z0-9-]/g, "-"); let id = base, k = 2; while (ctx.ports.some(x => x.id === id)) id = base + "-" + k++;
    try { await db.doc("portfolios/" + id).set({ name: id, description: "Cópia de " + p.name, targets: list(), createdAt: Date.now() }); toast("Carteira " + id + " criada"); } catch (e) { toast("Erro ao duplicar"); }
  }
  return html`<section class="panel" style=${{ borderTop: "3px solid " + p.color }}>
    <div class="panel-head"><h2>Carteira-alvo · ${p.name}</h2><span class=${"small num " + (Math.abs(tsum - 100) > 0.01 ? "warn" : "muted")}>Soma ${n2.format(tsum)}%</span></div>
    ${p.description && html`<p class="note">${p.description}</p>`}
    ${p.rationale?.length > 0 && html`<details><summary>Racional da carteira</summary><ul class="small">${p.rationale.map((r, i) => html`<li key=${i}>${r}</li>`)}</ul></details>`}
    <table><thead><tr><th>Ativo</th><th>Grupo</th><th class="r">Peso %</th><th></th></tr></thead>
      <tbody>${rows.map((r, i) => html`<tr key=${i}>
        <td><input type="text" id=${p.id + "-t" + i} aria-label="Ticker" value=${r.ticker} onInput=${e => upd(i, "ticker", e.target.value.toUpperCase())} style=${{ width: "90px" }} /></td>
        <td class="small muted">${M?.assets[r.ticker] ? macro(M.assets[r.ticker].sector) : (M ? "fora do universo" : "—")}</td>
        <td class="r"><input class="cell" id=${p.id + "-w" + i} aria-label="Peso-alvo" type="text" inputmode="decimal" value=${r.target} onInput=${e => upd(i, "target", e.target.value)} /></td>
        <td><button class="btn ghost" onClick=${() => setRows(rows.filter((_, j) => j !== i))}>Remover</button></td></tr>`)}</tbody></table>
    ${liveVio.length > 0 && html`<ul class="alerts">${liveVio.map((v, i) => html`<li key=${i} class=${v.k === "soma" || v.k === "universo" ? "bad" : ""}><span>${v.t}</span></li>`)}</ul>`}
    <div class="row"><button class="btn" onClick=${() => setRows([...rows, { ticker: "", target: "0" }])}>Adicionar</button><button class="btn primary" onClick=${save}>${liveVio.length ? "Salvar mesmo com violação" : "Salvar"}</button><button class="btn" onClick=${duplicate}>Duplicar</button></div>
  </section>`;
}
function Metodologia({ ctx }) {
  const { versions, methodology, rules, fallback, db, toast, M, decisions } = ctx;
  const [text, setText] = useState(JSON.stringify(rules, null, 2));
  const [note, setNote] = useState(""); const [copied, setCopied] = useState(false);
  useEffect(() => { setText(JSON.stringify(rules, null, 2)); }, [methodology?.version]);
  let parsed = null, perr = "";
  try { parsed = JSON.parse(text); if (!parsed.perfis || !parsed.limites) perr = "Faltam as chaves 'perfis' ou 'limites'."; } catch (e) { perr = "JSON inválido: " + e.message; }
  async function saveVersion() {
    if (perr) return; const v = Math.max(0, ...versions.map(x => x.version || 0)) + 1; parsed.versao = v;
    try { await db.doc("methodology/v" + v).set({ version: v, rules: parsed, note: note.trim(), createdAt: Date.now() }); setNote(""); toast(`Metodologia v${v} salva`); } catch (e) { toast("Erro ao salvar"); }
  }
  async function copyBackup() {
    try { await navigator.clipboard.writeText(JSON.stringify({ exportedAt: new Date().toISOString(), portfolios: ctx.portfolios, transactions: ctx.allTxs, decisions, methodology: versions }, null, 2)); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch (e) { toast("O navegador bloqueou a cópia"); }
  }
  return html`
  <div class="portgrid">${ctx.ports.map(p => html`<${PortfolioEditor} key=${p.id} p=${p} ctx=${ctx} />`)}</div>
  <div class="grid2">
    <section class="panel">
      <div class="panel-head"><h2>Regras ${methodology ? html`<span class="chip">v${methodology.version}</span>` : html`<span class="chip">padrão</span>`}</h2>
        <span class="small muted">${methodology ? `Salva em ${new Date(methodology.createdAt).toLocaleString("pt-BR")}${methodology.note ? " · " + methodology.note : ""}` : ""}</span></div>
      ${fallback && html`<div class="banner warn small">A versão salva não tem regras executáveis; o motor está usando as regras padrão abaixo. Salve uma versão para fixá-las.</div>`}
      <textarea id="rules" aria-label="Regras da metodologia em JSON" rows="30" value=${text} onInput=${e => setText(e.target.value)} spellcheck="false"></textarea>
      ${perr && html`<div class="banner warn small">${perr}</div>`}
      <div class="form">
        <label class="f" for="m-note">O que mudou<input id="m-note" type="text" value=${note} onInput=${e => setNote(e.target.value)} placeholder="ex.: DY-alvo de 6% para 7%" /></label>
        <button class="btn primary" onClick=${saveVersion} disabled=${!!perr || text === JSON.stringify(rules, null, 2)}>Salvar nova versão</button>
      </div>
      <p class="note">Valores em fração (0,06 = 6%). Cada perfil só aplica os critérios que define: sem "div_liq_ebitda_max", a alavancagem não entra na nota. "usar_preco_teto": false desliga o preço-teto. Versões antigas nunca são alteradas, e cada decisão guarda a versão em vigor.</p>
      ${versions.length > 0 && html`<details><summary>Histórico de versões (${versions.length})</summary><ul class="small">${[...versions].reverse().map(v => html`<li key=${v.version}>v${v.version} · ${new Date(v.createdAt).toLocaleDateString("pt-BR")} ${v.note ? "· " + v.note : ""}${v.rules ? "" : " (texto, sem regras executáveis)"}</li>`)}</ul></details>`}
    </section>
    <div class="stack">
      <section class="panel">
        <h2>Dados de mercado</h2>

}

/* ================= Auditoria: premissas e cálculos ================= */
const PILLAR_NAMES = { dividendos: "Dividendos", qualidade: "Qualidade", valuation: "Valuation" };
const fW = w => n2.format(w).replace(/,?0+$/, "").replace(/,$/, "");
function scoreExpression(sc) {
  if (!ok(sc?.score)) return "sem pontuação (faltam dados)";
  const parts = Object.entries(sc.weights).map(([k, w]) => `${fW(w)} × ${n1.format(sc.pillars[k])}`);
  const tw = Object.values(sc.weights).reduce((s, w) => s + w, 0);
  return `(${parts.join(" + ")}) ÷ ${fW(tw)} = ${n1.format(sc.raw)}${sc.penalty ? ` − ${sc.penalty} (penalidade cíclica)` : ""} = ${n0.format(sc.score)}`;
}
function ScoreAudit({ t, a, sc, M, rules }) {
  const ctx0 = { rules: rules || DEFAULT_RULES };
  if (!sc || sc.status === "semdados") return html`<div class="empty small">Sem dados de mercado para ${t}.</div>`;
  const byP = Object.keys(PILLAR_NAMES).map(k => ({ k, rows: sc.checks.filter(c => c.pillar === k) })).filter(x => x.rows.length);
  return html`<div class="stack" style=${{ gap: "10px" }}>
    <div class="small">Perfil de análise <strong>${sc.profile}</strong> · regras do perfil <code>${JSON.stringify(sc.profileRules)}</code> · cotação de <span class="num">${fDate(a.price_date)}</span> · coleta de <span class="num">${new Date(M.generated_at).toLocaleString("pt-BR")}</span></div>
    <div class="tablewrap"><table class="audit">
      <thead><tr><th>Pilar</th><th>Critério</th><th class="r">Dado</th><th>Campo de origem</th><th>Regra do perfil</th><th>Fórmula da nota</th><th class="r">Nota 0–1</th></tr></thead>
      ${byP.map(({ k, rows }) => html`<tbody key=${k}>
        ${rows.map((c, i) => html`<tr key=${i}>${i === 0 && html`<td rowspan=${rows.length + 1} class="pillar">${PILLAR_NAMES[k]}<div class="small muted">peso ${fW(sc.weights[k] ?? 0)}</div></td>`}
          <td>${c.label}</td><td class="r num">${c.value}</td><td class="small muted"><code>${c.field || "—"}</code></td><td class="small">${c.target}</td><td class="small muted formula">${c.formula}</td>
          <td class=${"r num " + (c.s == null || c.absent ? "muted" : c.s >= 0.7 ? "good" : c.s < 0.4 ? "bad" : "")}>${c.s == null ? "excluído" : c.absent ? "ausente → " + n2.format(c.s) : n2.format(c.s)}</td></tr>`)}
        <tr class="sub"><td colspan="5">Nota do pilar = média das notas disponíveis × 100</td><td class="r num"><strong>${ok(sc.pillars[k]) ? n1.format(sc.pillars[k]) : "—"}</strong></td></tr>
      </tbody>`)}
    </table></div>
    <div class="formula-box"><span class="muted small">Pontuação final</span><div class="num">${scoreExpression(sc)}</div>
      <div class="small muted">Status: ${STATUS_LABEL[sc.status]}${sc.reasons.length ? " — " + sc.reasons.join("; ") : ""}${sc.critMissing?.length ? " — falta campo crítico: " + sc.critMissing.join(", ") : ""}. Cobertura de dados: ${fPct(sc.coverage, 0)} dos critérios. ${sc.checks.some(c => c.absent && c.s != null) ? `Critério sem dado entra com nota ${n2.format(sc.checks.find(c => c.absent && c.s != null).s)} (não infla a média).` : "Critérios sem dado são excluídos da média do pilar; com 3 ou mais faltando, o status vira \"dados incompletos\"."}</div>
      ${sc.adj && html`<div class="small muted">Proventos recorrentes: teto de R$ ${fNum(sc.adj.cap)} por ação/ano (fator × mediana de R$ ${fNum(sc.adj.median)}).${sc.adj.flags.length ? ` Limitados como extraordinários: ${sc.adj.flags.join(", ")} (bruto 12m R$ ${fNum(a.dps_12m)}, DY bruto ${fPct(a.dy_12m)}).` : " Nenhum ano acima do teto."}${sc.adj.gaps?.length ? ` Ano(s) ${sc.adj.gaps.join(", ")} zerado(s) entre anos com pagamento: tratado(s) como lacuna de dados, não como corte (verificar no RI).` : ""}</div>`}
      ${(() => { const r = recommend(sc, null, ctx0.rules); return r.stages ? html`<div class="small">Sinal: <span class=${"pill " + r.action}>${ACTION_LABEL[r.action]}</span> ${r.why}<${Stages} st=${r.stages} /></div>` : ""; })()}</div>
  </div>`;
}

function Premissas({ ctx }) {
  const { M, rules, methodology, scored, ports, toast } = ctx;
  const [pick, setPick] = useState(ctx.targets[0]?.ticker || "");
  const [copied, setCopied] = useState(false);
  const [mdState, setMdState] = useState("");
  const [dl, setDl] = useState(undefined);
  useEffect(() => { let alive = true; if (!window.claude?.use) { setDl(null); return; } window.claude.use("downloads").then(x => alive && setDl(() => x)).catch(() => alive && setDl(null)); return () => { alive = false; }; }, []);
  if (!M) return html`<${NoMarket} />`;
  const tickers = Object.keys(M.assets).sort();
  async function exportMd(how) {
    const md = buildPremissasMd(ctx); const fname = `nbarsi-premissas-${todayISO()}.md`;
    try {
      if (how === "download" && dl) { await dl.save({ filename: fname, data: md }); setMdState("Arquivo gerado"); }
      else { await navigator.clipboard.writeText(md); setMdState("Markdown copiado"); }

    setTimeout(() => setMdState(""), 3000);
  }
  const priceDates = [...new Set(Object.values(M.assets).map(a => a.price_date).filter(Boolean))].sort();
  const divYears = Object.keys(Object.values(M.assets).find(a => a.dps_by_year)?.dps_by_year || {});
  const perfis = Object.entries(rules.perfis);
  const crit = ["dy_min", "roe_min", "payout_min", "div_liq_ebitda_max", "pl_max", "pvp_max", "usar_preco_teto", "penalidade_ciclica"];
  const fmtRule = (k, v) => v == null ? html`<span class="muted">—</span>` : typeof v === "boolean" ? (v ? "sim" : "não") : k.endsWith("_min") && k !== "lucro_anos_positivos_min" || k === "dy_min" ? fPct(v, 0) : k === "penalidade_ciclica" ? "−" + v : fX(v);
  async function copyCsv() {
    const keys = [...new Set(Object.values(scored).flatMap(s => s.checks.map(c => c.label)))];
    const head = ["ticker", "perfil", "status", "pontuacao", "bruta", "penalidade", "dividendos", "qualidade", "valuation", ...keys.map(k => "nota: " + k)];
    const lines = tickers.map(t => { const s = scored[t]; if (!s) return null; const m = Object.fromEntries(s.checks.map(c => [c.label, c.s])); return [t, M.assets[t].profile, s.status, s.score?.toFixed(2), s.raw?.toFixed(2), s.penalty || 0, s.pillars?.dividendos?.toFixed(2), s.pillars?.qualidade?.toFixed(2), s.pillars?.valuation?.toFixed(2), ...keys.map(k => m[k] == null ? "" : m[k].toFixed(3))].map(v => v == null ? "" : String(v).replace(".", ",")).join(";"); }).filter(Boolean);
    try { await navigator.clipboard.writeText([head.join(";"), ...lines].join("\n")); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch (e) { toast("O navegador bloqueou a cópia"); }
  }
  const P = rules.projecao;
  return html`
  <section class="panel export">
    <div class="panel-head"><div><h2>Exportar premissas</h2><p class="note">Markdown com fontes, fórmulas, regras em JSON, carteiras, retroteste, projeção e o cálculo de cada ativo. É o formato que o ChatGPT (e o Claude) leem com mais fidelidade.</p></div>
      <div class="row">${dl && html`<button class="btn primary" onClick=${() => exportMd("download")}>Baixar .md</button>`}<button class=${"btn" + (dl ? "" : " primary")} onClick=${() => exportMd("copy")}>Copiar markdown</button>${mdState && html`<span class="small muted">${mdState}</span>`}</div></div>
  </section>
  <${ConsistencyTests} ctx=${ctx} />
  <${RegimeTest} ctx=${ctx} />
  <${ReconUniverse} ctx=${ctx} />
  <section class="panel">
    <div class="panel-head"><h2>Fontes e datas dos dados</h2><span class="small muted">Tudo que entra no cálculo</span></div>
    <div class="tablewrap"><table>
      <thead><tr><th>Dado</th><th>Fonte</th><th>Data de referência</th><th>Observação</th></tr></thead>
      <tbody>
        <tr><td>Cotações (fechamento, sem ajuste)</td><td>Yahoo Finance via yfinance</td><td class="num">${priceDates.length ? fDate(priceDates[0]) + (priceDates.length > 1 ? " a " + fDate(priceDates[priceDates.length - 1]) : "") : "—"}</td><td class="small">Série semanal de ${M.dates.length} pontos, de ${fDate(M.dates[0])} a ${fDate(M.dates[M.dates.length - 1])}</td></tr>
        <tr><td>Proventos por ação</td><td>Yahoo Finance (eventos de dividendo)</td><td class="num">anos ${divYears[0]}–${divYears[divYears.length - 1]} + últimos 12 meses</td><td class="small">Por data-com, valores brutos; JCP pode vir bruto. Trocas de ticker podem zerar anos (ex.: CPLE3, ISAE4).</td></tr>
        <tr><td>ROE, P/L, P/VP, payout, dívida, EBITDA, margem</td><td>Yahoo Finance (campos returnOnEquity, trailingPE, priceToBook, payoutRatio, totalDebt, totalCash, ebitda)</td><td class="num">${new Date(M.generated_at).toLocaleDateString("pt-BR")}</td><td class="small">Últimos 12 meses informados pelo Yahoo; a data do balanço de origem não é exposta pela fonte.</td></tr>
        <tr><td>Lucro líquido anual</td><td>Yahoo Finance (income_stmt)</td><td class="num">até 4 exercícios</td><td class="small">Usado em "anos com lucro" e no crescimento do lucro da projeção.</td></tr>
        <tr><td>CDI</td><td>Banco Central, SGS série 12</td><td class="num">${fDate(M.cdi?.last_date)}</td><td class="small">Taxa diária anualizada (base 252): ${fNum(M.cdi?.annual_now)}% · Selic meta ${fNum(M.cdi?.selic_meta)}%</td></tr>
        <tr><td>Ibovespa e DIVO11</td><td>Yahoo Finance (^BVSP, DIVO11.SA ajustado)</td><td class="num">${fDate(M.dates[M.dates.length - 1])}</td><td class="small">DIVO11 é aproximação do IDIV e só existe desde 2019.</td></tr>
        <tr><td>Metodologia</td><td>Banco do artefato</td><td class="num">${methodology ? "v" + methodology.version + " · " + new Date(methodology.createdAt).toLocaleDateString("pt-BR") : "padrão"}</td><td class="small">${methodology?.note || ""}</td></tr>
      </tbody></table></div>
    ${M.errors?.length > 0 && html`<div class="banner warn small">Erros na última coleta: ${M.errors.join("; ")}</div>`}
  </section>

  <section class="panel">

    <ol class="steps">
      <li><strong>Critérios por perfil.</strong> Cada ação tem um perfil (banco, seguradora, utility…). Só entram os critérios que o perfil define; bancos e seguradoras, por exemplo, não usam dívida/EBITDA.</li>

      <li><strong>Nota do pilar</strong> = média das notas dos critérios do pilar × 100.</li>
      <li><strong>Pontuação</strong> = soma ponderada dos pilares ÷ soma dos pesos dos pilares com dados − penalidade cíclica do perfil. Pesos atuais: ${Object.entries(rules.pesos_score).map(([k, w]) => `${PILLAR_NAMES[k]} ${fPct(w, 0)}`).join(" · ")}.</li>
      <li><strong>Status:</strong> "fora" se falhar um filtro mínimo (liquidez ≥ ${fBRLc(rules.elegibilidade.liquidez_min)}/dia, ≥ ${rules.elegibilidade.anos_com_dividendos_min} anos com proventos em 5, lucro positivo em ≥ ${rules.elegibilidade.lucro_anos_positivos_min} anos); "dados incompletos" se 3 ou mais critérios sem dado; senão "elegível".</li>
      ${rules.proventos?.tratar_extraordinarios && html`<li><strong>Proventos extraordinários (v3):</strong> em cada ano dos últimos 5 e nos 12 meses, o provento por ação é limitado a ${n2.format(rules.proventos.fator_extraordinario)} × a mediana dos anos com pagamento. DY, crescimento, cortes, preço-teto e projeção usam esses valores recorrentes.</li>`}
      ${rules.dados?.campos_criticos && html`<li><strong>Dados (v3):</strong> cada perfil tem campos críticos; faltando um, o status é "dados incompletos" e não há compra automática. Critério sem dado entra com nota ${n2.format(rules.dados.nota_ausente ?? 0)}, em vez de ser excluído.</li>`}
      ${rules.recomendacao?.tres_estagios ? html`<li><strong>Sinal em três estágios (v3):</strong> elegibilidade (status elegível e dados críticos presentes) → atratividade (pontuação ≥ ${rules.recomendacao.score_compra}, valuation aplicável e margem ≥ ${fPct(rules.recomendacao.margem_minima_compra ?? 0, 0)}; sem preço-teto aplicável o sinal é "analisar") → alocação (dentro da carteira: abaixo do peso-alvo e com o grupo abaixo de ${fPct(rules.limites.max_peso_setor, 0)}). Só os três aprovados geram "comprar"; fora de uma carteira o máximo é "atrativo". Revisar se pontuação abaixo de ${rules.recomendacao.score_revisar} ou 2+ cortes de proventos.</li>` : html`<li><strong>Sinal:</strong> revisar se pontuação abaixo de ${rules.recomendacao.score_revisar} ou 2+ cortes de proventos; aguardar se a cotação estiver mais de ${fPct(-rules.recomendacao.margem_aguardar, 0)} acima do preço-teto; comprar se pontuação ≥ ${rules.recomendacao.score_compra}, margem ≥ 0 e abaixo do peso-alvo; manter nos demais casos.</li>`}
    </ol>
    <div class="tablewrap"><table>
      <thead><tr><th>Critério</th><th>Pilar</th><th>Fórmula da nota (0–1)</th></tr></thead>
      <tbody>${[["Dividend yield 12m", "Dividendos", FORMULAS.dy], ["Anos com proventos", "Dividendos", FORMULAS.anos], ["Cortes de proventos", "Dividendos", FORMULAS.cortes], ["Crescimento dos proventos", "Dividendos", FORMULAS.cresc], ["ROE", "Qualidade", FORMULAS.roe], ["Anos com lucro", "Qualidade", FORMULAS.lucro], ["Dívida líquida / EBITDA", "Qualidade", FORMULAS.dl], ["Payout", "Qualidade", FORMULAS.payout], ["Margem até o preço-teto", "Valuation", FORMULAS.margem], ["P/L e P/VP", "Valuation", FORMULAS.mult]].map(r => html`<tr key=${r[0]}><td>${r[0]}</td><td>${r[1]}</td><td class="small formula">${r[2]}</td></tr>`)}</tbody>

  </section>

  ${ctx.scoredPrev && (() => {

    const inPorts = new Set(ports.flatMap(p => p.targets.map(t => t.ticker)));
    const rows = tickers.filter(t => scored[t] && sp[t]).map(t => { const a = recommend(sp[t], null, pr), b = recommend(scored[t], null, rules); const d = ok(scored[t].score) && ok(sp[t].score) ? scored[t].score - sp[t].score : null; return { t, a, b, d, held: inPorts.has(t) }; })
      .filter(r => r.held || r.a.action !== r.b.action || Math.abs(r.d || 0) >= 8).sort((x, y) => (y.held - x.held) || Math.abs(y.d || 0) - Math.abs(x.d || 0));
    const changed = rows.filter(r => r.a.action !== r.b.action).length;
    return html`<section class="panel">

      <div class="tablewrap"><table>
        <thead><tr><th>Ativo</th><th class="r">Pontuação v${pv}</th><th class="r">Pontuação v${cv}</th><th class="r">Δ</th><th>Sinal v${pv}</th><th>Sinal v${cv}</th><th>Por quê (v${cv})</th></tr></thead>
        <tbody>${rows.map(r => html`<tr key=${r.t} class="click" onClick=${() => ctx.openAsset(r.t)}>
          <td><span class="tick">${r.t}</span> ${ports.filter(p => p.targets.some(x => x.ticker === r.t)).map(p => html`<span key=${p.id} class="chip port" style=${{ borderColor: p.color }}>${shortName(p.name)}</span>`)}</td>
          <td class="r num">${ok(sp[r.t].score) ? n0.format(sp[r.t].score) : "—"}</td><td class="r num">${ok(scored[r.t].score) ? n0.format(scored[r.t].score) : "—"}</td>
          <td class=${"r num " + cls(r.d)}>${ok(r.d) ? (r.d >= 0 ? "+" : "") + n0.format(r.d) : "—"}</td>
          <td><span class=${"pill " + r.a.action}>${ACTION_LABEL[r.a.action]}</span></td><td><span class=${"pill " + r.b.action}>${ACTION_LABEL[r.b.action]}</span></td>
          <td class="small" style=${{ whiteSpace: "normal", minWidth: "260px" }}>${r.b.why}</td></tr>`)}</tbody>
      </table></div>
    </section>`; })()}

  <section class="panel">
    <div class="panel-head"><h2>Regras por perfil em vigor</h2><span class="small muted">Edite em Metodologia; cada alteração vira uma nova versão</span></div>
    <div class="tablewrap"><table>
      <thead><tr><th>Perfil</th>${crit.map(c => html`<th key=${c} class="r">${c}</th>`)}<th class="r">Ativos no universo</th></tr></thead>

    </table></div>

  <section class="panel">

  <section class="panel">

    <div class="tablewrap"><table>

      <tbody>${tickers.filter(t => scored[t]).sort((a, b) => (scored[b].score ?? -1) - (scored[a].score ?? -1)).map(t => { const s = scored[t]; return html`<tr key=${t} class="click" onClick=${() => setPick(t)}>

        <td class="r num">${ok(s.pillars?.dividendos) ? n0.format(s.pillars.dividendos) : "—"}</td><td class="r num">${ok(s.pillars?.qualidade) ? n0.format(s.pillars.qualidade) : "—"}</td><td class="r num">${ok(s.pillars?.valuation) ? n0.format(s.pillars.valuation) : "—"}</td>
        <td class="r num">${s.penalty ? "−" + s.penalty : ""}</td><td class="small num">${scoreExpression(s)}</td><td><span class=${"pill " + s.status}>${STATUS_LABEL[s.status]}</span></td></tr>`; })}</tbody>

  <section class="panel">
    <h2>Premissas de desempenho, retroteste e projeção</h2>
    <ul class="small" style=${{ margin: 0, paddingLeft: "18px", display: "grid", gap: "6px", maxWidth: "95ch" }}>
      <li><strong>Desempenho e retroteste</strong> usam o método de cotas sobre a série semanal: aportes e vendas não distorcem o retorno. Proventos entram pela data-com × quantidade em carteira (brutos) e ficam em caixa, sem reinvestimento. A "cesta atual no passado" (retroteste ilustrativo, não point-in-time) compra R$ 100 mil nos pesos-alvo no início do período (1, 3, 5, 7, 10 ou 15 anos) e não rebalanceia; ações que ainda não existiam entram quando passam a negociar.</li>
      <li><strong>Benchmarks:</strong> CDI acumulado da série 12 do BCB; DIVO11 (ajustado) como proxy do IDIV; Ibovespa sem ajuste. Quando um benchmark começa depois do início do período, a linha parte do valor da carteira naquela data.</li>
      <li><strong>Projeção</strong> (7, 10 e 15 anos): retorno esperado = DY normalizado + crescimento dos proventos. DY normalizado = média entre o DY de 12 meses e a média de proventos de 5 anos ÷ cotação, limitado a ${fPct(P.dy_max, 0)}. Crescimento = ${fPct(P.peso_historico, 0)} × crescimento histórico (média entre proventos e lucro, limitado entre ${fPct(P.crescimento_min, 0)} e ${fPct(P.crescimento_max, 0)}) + ${fPct(1 - P.peso_historico, 0)} × inflação de ${fPct(P.inflacao, 0)}. Cenários: pessimista −${fPct(P.spread_pessimista, 0)} a.a., otimista +${fPct(P.spread_otimista, 0)} a.a. CDI: de ${fNum(M.cdi?.annual_now)}% convergindo linearmente para ${fPct(P.cdi_longo_prazo, 0)} em ${P.anos_convergencia_cdi} anos. Sem impostos, custos ou rebalanceamento.</li>
      <li><strong>Agrupamento para limites:</strong> bancos, seguros e serviços financeiros = Financeiro; mineração, siderurgia, petróleo, papel e química = Commodities. Limites: ${fPct(rules.limites.max_peso_ativo, 0)} por ativo e ${fPct(rules.limites.max_peso_setor, 0)} por grupo.</li>
      <li><strong>Comitê e chat de IA</strong> recebem estes mesmos números e as regras em JSON, e são instruídos a não inventar dados. As respostas não alteram a pontuação.</li>
    </ul>
  </section>`;
}

function mdLite(text) {
  const lines = String(text || "").split("\n"); const out = []; let list = [];
  const inline = (t, k) => t.split(/(\*\*[^*]+\*\*)/g).map((part, i) => part.startsWith("**") && part.endsWith("**") ? html`<strong key=${k + "-" + i}>${part.slice(2, -2)}</strong>` : part);
  const flush = () => { if (list.length) { out.push(html`<ul key=${"u" + out.length}>${list}</ul>`); list = []; } };
  lines.forEach((l, i) => {
    const t = l.trim();
    if (/^[-*•] /.test(t)) { list.push(html`<li key=${i}>${inline(t.slice(2), i)}</li>`); return; }
    flush();
    if (!t) return;
    if (/^#{1,4} /.test(t)) out.push(html`<p key=${i}><strong>${t.replace(/^#+ /, "")}</strong></p>`);
    else out.push(html`<p key=${i}>${inline(t, i)}</p>`);
  });
  flush(); return out;
}

function nearEvents(date, sectorKey, before = 60, after = 14) {

function holdMap(ports) {

/* correlação de Pearson entre duas listas (ignora pares incompletos) */
function corr(x, y) { const p = x.map((v, i) => [v, y[i]]).filter(([a, b]) => ok(a) && ok(b)); if (p.length < 20) return null; const n = p.length; const mx = p.reduce((s, q) => s + q[0], 0) / n, my = p.reduce((s, q) => s + q[1], 0) / n; let sxy = 0, sxx = 0, syy = 0; for (const [a, b] of p) { sxy += (a - mx) * (b - my); sxx += (a - mx) ** 2; syy += (b - my) ** 2; } return sxx && syy ? sxy / Math.sqrt(sxx * syy) : null; }
function weeklyRets(arr, i0) { const o = []; for (let i = i0 + 1; i < arr.length; i++) o.push(ok(arr[i]) && ok(arr[i - 1]) && arr[i - 1] > 0 ? arr[i] / arr[i - 1] - 1 : null); return o; }
function basketWeekly(p, M, i0) { const tot = p.targets.reduce((a, x) => a + x.target, 0) || 1; const o = [];
  for (let i = i0 + 1; i < M.dates.length; i++) { let s = 0, w = 0; for (const t of p.targets) { const c = M.assets[t.ticker]?.close; if (c && ok(c[i]) && ok(c[i - 1]) && c[i - 1] > 0) { s += t.target / tot * (c[i] / c[i - 1] - 1); w += t.target / tot; } } o.push(w > 0.5 ? s / w : null); }
  return o; }

function NewsMacro({ ctx }) {
  const { M, ports } = ctx;

  const al = arr => { if (aligned) return arr; const m = {}; md.forEach((d, i) => m[d] = arr[i]); let last = null; return M.dates.map(d => (m[d] !== undefined ? (last = m[d]) : last)); };
  const S = Object.fromEntries(Object.entries(mc).map(([k, v]) => [k, al(v)]));
  const startI = Math.max(0, M.dates.length - 1 - 52 * yrs);
  const i5 = Math.max(0, M.dates.length - 1 - 260);

  const rows = ports.map(p => { const r = basketWeekly(p, M, i5); const tot = p.targets.reduce((a, x) => a + x.target, 0) || 1;

  const order = ["selic", "ipca12", "usd", "brent", "minerio"].filter(k => S[k]);
  return html`
  <section class="panel">
    <div class="panel-head"><h2>Sensibilidade das carteiras</h2><span class="small muted">Correlação semanal, últimos 5 anos, cesta atual (preço)</span></div>

    <tbody>${rows.map(r => html`<tr key=${r.p.id}><td><span class="swatch" style=${{ background: r.p.color }}></span>${r.p.name}</td><td class="r num">${fC(r.c.ibov)}</td><td class="r num">${fC(r.c.usd)}</td><td class="r num">${fC(r.c.brent)}</td><td class="r num">${fC(r.c.minerio)}</td><td class="r num">${fPct(r.juros, 0)}</td><td class="r num">${fPct(r.est, 0)}</td><td class="r num">${fPct(r.comm, 0)}</td><td class="r num">${fPct(r.fin, 0)}</td></tr>`)}</tbody></table></div>
    <p class="note">Correlação perto de −1 ou +1 indica que a carteira costuma andar junto (ou contra) o fator na mesma semana; acima de 0,4 em módulo aparece destacada. Juros-sensíveis = elétricas, saneamento e construção (ganham com corte da Selic). Estatais = ${ESTATAIS.join(", ")} (risco de interferência na política de proventos).</p>
  </section>
  <section class="panel">

/* ================= teste de regime (janelas de proventos) ================= */
const REGIMES = [
  { id: "atual", nome: "Atual (2021–2025)", years: null },
  { id: "longa", nome: "Janela longa (2016–2025)", years: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025] },
  { id: "sem", nome: "Sem pandemia e boom (2017–19 e 2023–25)", years: [2017, 2018, 2019, 2023, 2024, 2025] }
];
function windowAsset(a, years, ov) {
  if (!a || !years || !a.divs) return a;
  const by = {}; years.forEach(y => by[y] = 0);
  for (const [d, v] of a.divs) { const y = +d.slice(0, 4); if (y in by) by[y] += v; }
  for (const y of years) { const o = ov?.[y]; if (o && ok(o.value)) by[y] = o.value; }
  const vals = years.map(y => by[y]); const paid = vals.filter(v => v > 0).length;
  const first = vals.findIndex(v => v > 0); let lastI = vals.length - 1; while (lastI >= 0 && !(vals[lastI] > 0)) lastI--;
  const span = first >= 0 && lastI > first ? years[lastI] - years[first] : 0;
  const cagr = span > 0 && vals[0] > 0 && vals[vals.length - 1] > 0 ? Math.pow(vals[vals.length - 1] / vals[0], 1 / (years[years.length - 1] - years[0])) - 1 : null;
  let cuts = 0; for (let i = 1; i < vals.length; i++) if (vals[i - 1] > 0 && vals[i] < vals[i - 1] * 0.8) cuts++;
  const avg = vals.reduce((s, v) => s + v, 0) / vals.length;
  return { ...a, dps_by_year: Object.fromEntries(years.map(y => [String(y), by[y]])), dps_avg_5y: avg, dy_avg_5y_on_price: a.price ? avg / a.price : null, div_years_paid: Math.round(paid / years.length * 5), div_cuts_20pct: Math.round(cuts * 4 / (years.length - 1)), dps_cagr: cagr };
}
function runRegimes(ctx) {
  const { M, rules, ports } = ctx; const ov = ctx.overrides?.items || {};
  const res = {};
  for (const R of REGIMES) { const sc = {}; for (const [t, a] of Object.entries(M.assets)) { const s = scoreAsset(R.years ? windowAsset(a, R.years, ov[t]) : a, rules); sc[t] = { s, act: s.score != null ? recommend(s, null, rules).action : "dados" }; } res[R.id] = sc; }
  const port = ports.map(p => { const tot = p.targets.reduce((a, x) => a + x.target, 0) || 1;
    return { p, v: Object.fromEntries(REGIMES.map(R => { const sc = res[R.id]; return [R.id, { score: p.targets.reduce((s, x) => s + x.target / tot * (sc[x.ticker]?.s.score || 0), 0), atr: p.targets.filter(x => ["comprar", "atrativo"].includes(sc[x.ticker]?.act)).reduce((s, x) => s + x.target / tot, 0) }]; })) }; });
  const changed = Object.keys(M.assets).filter(t => new Set(REGIMES.map(R => res[R.id][t].act)).size > 1 || REGIMES.some(R => Math.abs((res[R.id][t].s.score || 0) - (res.atual[t].s.score || 0)) >= 8));
  return { res, port, changed };
}
function RegimeTest({ ctx }) {
  const { M, ports } = ctx;
  const out = useMemo(() => runRegimes(ctx), [ctx.rules, ctx.ports, ctx.overrides, M]);
  const hm = holdMap(ports);
  const list = out.changed.sort((a, b) => (hm[b] ? 1 : 0) - (hm[a] ? 1 : 0) || a.localeCompare(b));
  return html`<section class="panel">
    <div class="panel-head"><h2>Teste de regime</h2><span class="small muted">A metodologia recalculada com outras janelas de proventos</span></div>
    <p class="note" style=${{ marginBottom: "6px" }}>A janela padrão de proventos (2021–2025) começa na saída da pandemia: bancos partem da base baixa de 2020–21 (limite do CMN) e commodities carregam o boom de 2022. O teste repete a pontuação com a janela longa de 10 anos e com uma janela que exclui 2020–2022, mantendo as demais regras e as correções manuais.</p>
    <div class="tablewrap"><table><thead><tr><th>Carteira</th>${REGIMES.map(R => html`<th key=${R.id} class="r">${R.nome}<div class="small muted">pontuação · % em atrativo</div></th>`)}</tr></thead>
    <tbody>${out.port.map(x => html`<tr key=${x.p.id}><td><span class="swatch" style=${{ background: x.p.color }}></span>${x.p.name}</td>${REGIMES.map(R => html`<td key=${R.id} class="r num">${n1.format(x.v[R.id].score)} · ${fPct(x.v[R.id].atr, 0)}</td>`)}</tr>`)}</tbody></table></div>
    <h3 class="small" style=${{ margin: "10px 0 4px" }}>Ativos cujo sinal muda ou cuja pontuação varia 8 pontos ou mais (${list.length})</h3>
    <div class="tablewrap"><table><thead><tr><th>Ativo</th>${REGIMES.map(R => html`<th key=${R.id}>${R.nome}</th>`)}<th>Carteiras</th></tr></thead>
    <tbody>${list.map(t => html`<tr key=${t}><td><a class="tick" href=${"#ativo-" + t.toLowerCase()} onClick=${e => { e.preventDefault(); ctx.openAsset(t); }}>${t}</a></td>
      ${REGIMES.map(R => { const x = out.res[R.id][t]; return html`<td key=${R.id}><span class="num">${ok(x.s.score) ? n0.format(x.s.score) : "—"}</span> <span class=${"pill small " + x.act}>${ACTION_LABEL[x.act] || x.act}</span></td>`; })}
      <td>${(hm[t] || []).map(h => html`<span key=${h.p.id} class="chip port" style=${{ borderColor: h.p.color }}>${shortName(h.p.name)}</span>`)}</td></tr>`)}</tbody></table></div>
    <p class="note">Sinais calculados fora de carteira (no máximo "atrativo"). Anos com proventos e cortes são reescalados para a régua de 5 anos. Preço-teto usa a média da janela.</p>
  </section>`;
}

function eventCat(e) {
